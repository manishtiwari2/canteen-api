name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: canteen
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: canteen_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U canteen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://canteen:ci-only-password@localhost:5432/canteen_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Migration and integration tests
        run: npm run test:integration

      - name: Build Docker image
        run: docker build -t canteen-api:ci .