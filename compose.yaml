services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: canteen
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpass123}
      POSTGRES_DB: canteen
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canteen -d canteen"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://canteen:${DB_PASSWORD:-devpass123}@db:5432/canteen
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: